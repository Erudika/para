        in: query
        required: false
        schema:
          type: string
        description: Latitude and longitude as `latitude,longitude`.
      - name: radius
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Nearby search radius in kilometers.
      - name: like
        in: query
        required: false
        schema:
          type: string
        description: Text or object ID used for a similar-object search.
      - name: fields
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Fields to compare in a similar-object search. Repeat for multiple fields.
      - name: filterid
        in: query
        required: false
        schema:
          type: string
        description: Object ID to exclude from a similar-object search.
      - name: tags
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Tags to match. Repeat for multiple tags.
      - name: terms
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Terms to match. Repeat for multiple terms.
      - name: matchall
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Require all terms to match.
      - name: count
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Return only the result count when true.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: Page number.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 30
        description: Maximum number of results per page.
      - name: desc
        in: query
        required: false
        schema:
          type: boolean
          default: true
        description: Sort in descending order.
      - name: sort
        in: query
        required: false
        schema:
          type: string
        description: Field to sort by.
      - name: lastKey
        in: query
        required: false
        schema:
          type: string
        description: Continuation key for the next page.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Paged result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse'
