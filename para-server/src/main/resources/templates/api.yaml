openapi: 3.2.0
info:
  title: Para REST API
  description: Para REST API. All API methods require authentication by default unless marked public. Object payloads
    are open-ended because Para supports user-defined types. JSON object fields can be limited with the `select`
    query parameter - a comma-separated field list and applies to serialized object responses.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: /
  description: Current host
paths:
  /v1/{type}/{id}:
    get:
      tags:
      - objects
      operationId: read
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Para object type.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Object ID.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Read an object
      description: Returns an object of the requested type. Use the type plural in the URL. The type-only route
        `/v1/{type}` lists objects instead.
    put:
      tags:
      - objects
      operationId: overwrite
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Para object type.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Object ID.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Request succeeded.
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid object or request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Replace an object
      description: Replaces an object, or creates it when the ID does not exist.
      requestBody:
        required: true
        description: Replacement object properties.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParaObjectInput'
    delete:
      tags:
      - objects
      operationId: delete
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Para object type.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Object ID.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: No content.
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Delete request was not permitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete an object
      description: Deletes an object and returns an empty 200 response. The endpoint can return 400 when deletion
        is not permitted.
    patch:
      tags:
      - objects
      operationId: update
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Para object type.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Object ID.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Object updated. Vote requests return a boolean result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParaObjectInput'
              example:
                id: tag:tag1
                timestamp: 1399721289987
                type: tag
                appid: para
                name: tag tag:tag1
                votes: 0
                plural: tags
                objectURI: /tags/tag1
                tag: tag1
                count: 0
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid object or request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: Precondition failed because of optimistic locking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Update an object
      description: 'Partially updates an object. PATCH also supports vote bodies such as `{ "_voteup": "user123"
        }`; optimistic-lock failures can return 412.'
      requestBody:
        required: true
        description: Object properties to update.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParaObjectInput'
  /v1/{type}/{id}/links/{id2}:
    put:
      tags:
      - links
      operationId: putLink
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Para object type.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Object ID.
      - name: id2
        in: path
        required: true
        schema:
          type: string
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Created link ID.
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Create or replace a link
      description: Creates a many-to-many link. PUT has the same behavior as POST.
    post:
      tags:
      - links
      operationId: createLink
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Para object type.
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Object ID.
      - name: id2
        in: path
        required: true
        schema:
          type: string
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Created link ID.
          content:
            text/plain:
              schema:
                type: string
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Create a link
      description: Creates a many-to-many link. For one-to-many relationships, set the child object `parentid` instead.
  /v1/_settings:
    get:
      tags:
      - settings
      operationId: getSettings
      responses:
        '200':
          description: Custom app settings.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: List app settings
      description: Lists custom key-value settings stored on the app.
      parameters:
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
    put:
      tags:
      - settings
      operationId: putSettings
      responses:
        '200':
          description: Request succeeded.
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Replace app settings
      description: Replaces all custom app settings with the JSON object in the request body.
      requestBody:
        required: true
        description: Settings to replace.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsInput'
      parameters:
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
  /v1/_settings/{key}:
    get:
      tags:
      - settings
      operationId: getSetting
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Setting key.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Custom setting value.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value: {}
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Get an app setting
      description: Returns one custom app setting.
    put:
      tags:
      - settings
      operationId: putSetting
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Setting key.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Request succeeded.
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Set an app setting
      description: Adds or replaces one setting when `key` is supplied. Without `key`, replaces all app settings.
      requestBody:
        required: true
        description: Setting value or settings map.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsInput'
    delete:
      tags:
      - settings
      operationId: deleteSetting
      parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
        description: Setting key.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Request succeeded.
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete an app setting
      description: Removes one custom app setting.
  /v1/_permissions/{subjectid}/{type}:
    put:
      tags:
      - permissions
      operationId: grantPermission
      parameters:
      - name: subjectid
        in: path
        required: true
        schema:
          type: string
        description: Subject ID.
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Para object type.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Updated resource permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsMap'
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid permission request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: App, subject or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Grant resource permissions
      description: Grants HTTP methods or flags for a URL-encoded resource. Flags include GET, POST, PUT, PATCH,
        DELETE, `?`, `-`, `*` and `OWN`.
      requestBody:
        required: true
        description: Allowed HTTP methods.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionMethodsInput'
    delete:
      tags:
      - permissions
      operationId: revokePermission
      parameters:
      - name: subjectid
        in: path
        required: true
        schema:
          type: string
        description: Subject ID.
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Para object type.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Updated resource permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsMap'
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid permission request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: App, subject or resource not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Revoke a resource permission
      description: Revokes permissions for a subject and resource.
  /v1/_import:
    put:
      tags:
      - storage operations
      operationId: restore
      parameters:
      - name: filename
        in: query
        required: false
        schema:
          type: string
        description: Name to assign to the imported backup.
      responses:
        '200':
          description: Import summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParaObjectInput'
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Import failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Import app data
      description: Imports a previously exported ZIP archive and overwrites existing objects. The request must use
        `application/zip`.
      requestBody:
        required: true
        description: ZIP archive to import.
        content:
          application/zip:
            schema:
              type: string
              format: binary
  /v1/_constraints/{type}/{field}/{cname}:
    put:
      tags:
      - constraints
      operationId: addConstraint
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Para object type.
      - name: field
        in: path
        required: true
        schema:
          type: string
        description: Field name used by the selected search method.
      - name: cname
        in: path
        required: true
        schema:
          type: string
        description: Constraint name.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Validation constraints after the update.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid constraint request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Add a validation constraint
      description: Adds a validation constraint. Supported names include `required`, `email`, `false`, `true`, `past`,
        `present`, `url`, `min`, `max`, `size`, `digits` and `pattern`.
      requestBody:
        required: true
        description: Constraint configuration.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsInput'
    delete:
      tags:
      - constraints
      operationId: removeConstraint
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Para object type.
      - name: field
        in: path
        required: true
        schema:
          type: string
        description: Field name used by the selected search method.
      - name: cname
        in: path
        required: true
        schema:
          type: string
        description: Constraint name.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Validation constraints after the update.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid constraint request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Remove a validation constraint
      description: Removes a validation constraint and returns the remaining constraints for the type.
  /v1/_batch:
    get:
      tags:
      - batch operations
      operationId: batchRead
      parameters:
      - name: ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Object IDs. Repeat this parameter for multiple IDs. At least one ID is required for success.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: Objects found.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParaObjectInput'
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: No IDs were supplied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Read objects in a batch
      description: Returns objects for repeated `ids` parameters. At least one ID is required for a successful request.
    put:
      tags:
      - batch operations
      operationId: batchPut
      responses:
        '200':
          description: Objects returned by the batch operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParaObjectInput'
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Create or replace objects in a batch
      description: Creates or replaces multiple objects. PUT has the same batch behavior as POST; the documented
        maximum request size is 1 MB.
      requestBody:
        required: true
        description: Objects to create or replace.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParaObjectBatchInput'
      parameters:
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
    post:
      tags:
      - batch operations
      operationId: batchCreate
      responses:
        '200':
          description: Objects returned by the batch operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParaObjectInput'
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Create objects in a batch
      description: Creates multiple objects. The body is a JSON array; the documented maximum request size is 1
        MB.
      requestBody:
        required: true
        description: Objects to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParaObjectBatchInput'
      parameters:
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
    delete:
      tags:
      - batch operations
      operationId: batchDelete
      parameters:
      - name: ids
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
        description: Object IDs. Repeat this parameter for multiple IDs. At least one ID is required for success.
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: No IDs were supplied or the request exceeds the implementation limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Delete objects in a batch
      description: Deletes multiple objects using repeated `ids` parameters. At least one ID is required for success.
    patch:
      tags:
      - batch operations
      operationId: batchUpdate
      responses:
        '200':
          description: Objects returned by the batch operation.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ParaObjectInput'
        default:
          description: Error response. Status and body depend on validation, access rules and server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid batch request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: All updates failed because of optimistic locking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      summary: Update objects in a batch
      description: Partially updates multiple objects. Each object must contain `id` and `type`. Optimistic-lock
        failures can return 412.
      requestBody:
        required: true
        description: Object updates. Each item must include an ID.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParaObjectBatchInput'
      parameters:
      - name: select
        in: query
        required: false
        description: Comma-separated fields to include in object responses, for example `id,name,my_field`.
        schema:
          type: string
        example: id,name,my_field
  /v1/{type}:
    get:
      tags:
      - objects
      operationId: searchType
      parameters:
      - name: type
        in: path
        required: true
        schema:
          type: string
        description: Para object type.
      - name: q
        in: query
        required: false
        schema:
          type: string
          default: '*'
        description: Search query. If omitted, the API searches all objects.
      - name: count
        in: query
        required: false
        schema:
          type: boolean
          default: false
