<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Para - {{title}}</title>
    <style>
      /* Base */
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      html {
        box-sizing: border-box;
        background-color: #444444;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        text-size-adjust: 100%;
      }
      body,
      p,
      h1 {
        margin: 0;
        padding: 0;
      }
      h1 {
        font-size: 100%;
        font-weight: normal;
      }
      body {
        color: hsl(221, 14%, 90%);
        font-family: "Inter", "SF Pro", "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Helvetica Neue", "Helvetica", "Arial", sans-serif;
        font-size: 1em;
        font-weight: 400;
        line-height: 1.5;
      }
      a {
        color: hsl(198, 100%, 70%);
        cursor: pointer;
        text-decoration: none;
      }
      a strong {
        color: currentColor;
      }
      strong {
        color: hsl(221, 14%, 98%);
        font-weight: 600;
      }
      svg {
        height: auto;
        width: auto;
      }

      /* Navbar */
      .navbar {
        min-height: 3.25rem;
        position: relative;
        z-index: 30;
      }
      .navbar-brand {
        align-items: stretch;
        display: flex;
        flex-shrink: 0;
        min-height: 3.25rem;
      }
      .navbar-burger {
        align-items: center;
        align-self: center;
        appearance: none;
        background: none;
        border: none;
        border-radius: 0.5em;
        color: hsl(198, 100%, 70%);
        cursor: pointer;
        display: inline-flex;
        flex-direction: column;
        flex-shrink: 0;
        height: 2.5rem;
        justify-content: center;
        margin-inline-end: 0.375rem;
        margin-inline-start: auto;
        padding: 0;
        position: relative;
        vertical-align: top;
        width: 2.5rem;
      }
      .navbar-burger span {
        background-color: currentColor;
        display: block;
        height: 2px;
        left: calc(50% - 10px);
        position: absolute;
        transform-origin: center;
        width: 20px;
      }
      .navbar-burger span:nth-child(1),
      .navbar-burger span:nth-child(2) {
        top: calc(50% - 1px);
      }
      .navbar-burger span:nth-child(3) {
        bottom: calc(50% + 5px);
      }
      .navbar-burger span:nth-child(4) {
        top: calc(50% + 5px);
      }
      .navbar-menu {
        display: none;
      }
      .navbar-item {
        color: hsl(221, 14%, 90%);
        display: block;
        flex-grow: 0;
        flex-shrink: 0;
        gap: 0.75rem;
        line-height: 1.5;
        padding: 0.5rem 0.75rem;
        position: relative;
      }
      .navbar-item svg {
        max-height: 1.75rem;
      }
      a.navbar-item {
        background-color: transparent;
        cursor: pointer;
      }
      a.navbar-item:hover,
      a.navbar-item:focus {
        background-color: hsla(0, 0%, 100%, 0.1);
      }
      @media screen and (max-width: 1023px) {
        .navbar-brand .navbar-item {
          align-items: center;
          display: flex;
        }
        .navbar-menu {
          background-color: #3a3a3a;
          box-shadow: 0 0.5em 1em rgba(0, 0, 0, 0.35);
          padding: 0.5rem 0;
        }
        .navbar-menu.is-active {
          display: block;
        }
      }
      @media screen and (min-width: 1024px) {
        .navbar,
        .navbar-menu,
        .navbar-start,
        .navbar-end {
          align-items: stretch;
          display: flex;
        }
        .navbar-burger {
          display: none;
        }
        .navbar-item {
          align-items: center;
          display: flex;
        }
        .navbar-menu {
          flex-grow: 1;
          flex-shrink: 0;
        }
        .navbar-start {
          justify-content: flex-start;
          margin-inline-end: auto;
        }
        .navbar-end {
          justify-content: flex-end;
          margin-inline-start: auto;
        }
      }

      /* Hero */
      .hero {
        align-items: stretch;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .hero.is-fullheight {
        min-height: 100vh;
      }
      .hero-body {
        flex-grow: 1;
        flex-shrink: 0;
        padding: 3rem 1.5rem;
      }
      @media screen and (min-width: 769px) {
        .hero-body {
          padding: 3rem 3rem;
        }
      }
      .hero.is-fullheight .hero-body {
        align-items: center;
        display: flex;
      }
      .hero.is-fullheight .hero-body > .container {
        flex-grow: 1;
        flex-shrink: 1;
      }
      .container {
        flex-grow: 1;
        margin: 0 auto;
        position: relative;
        width: 100%;
      }
      @media screen and (min-width: 1024px) {
        .container {
          max-width: 960px;
        }
      }
      @media screen and (min-width: 1216px) {
        .container {
          max-width: 1152px;
        }
      }
      @media screen and (min-width: 1408px) {
        .container {
          max-width: 1344px;
        }
      }

      /* Title */
      .title {
        color: hsl(221, 14%, 98%);
        font-size: 2rem;
        font-weight: 800;
        line-height: 1.125;
        word-break: break-word;
      }
      .title:not(:last-child) {
        margin-bottom: 1.5rem;
      }

      /* Footer */
      .footer {
        color: hsl(221, 14%, 90%);
        padding: 3rem 1.5rem 6rem;
      }

      /* Buttons */
      .buttons {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: flex-start;
      }
      .button {
        align-items: center;
        appearance: none;
        border: 0 solid hsl(221, 14%, 86%);
        border-radius: 0.375rem;
        box-shadow: 0 0.0625em 0.125em hsla(0, 0%, 20%, 0), 0 0.125em 0.25em hsla(0, 0%, 20%, 0);
        cursor: pointer;
        display: inline-flex;
        font-size: 1rem;
        font-weight: 500;
        height: auto;
        justify-content: center;
        line-height: 1.5;
        padding: 0.5em 1em;
        position: relative;
        text-align: center;
        transition-duration: 294ms;
        transition-property: background-color, border-color, box-shadow, color;
        vertical-align: top;
        white-space: nowrap;
      }
      .button strong {
        color: inherit;
      }
      .button.is-small {
        border-radius: 0.25rem;
        font-size: 0.75rem;
      }
      .button.is-dark {
        background-color: hsl(221, 14%, 21%);
        border-color: hsl(221, 14%, 21%);
        color: hsl(221, 14%, 96%);
      }
      .button.is-dark:hover,
      .button.is-dark:focus {
        background-color: hsl(221, 14%, 16%);
      }
      .button.is-info {
        background-color: hsl(198, 100%, 70%);
        border-color: hsl(198, 100%, 70%);
        color: hsl(198, 100%, 10%);
      }
      .button.is-info:hover,
      .button.is-info:focus {
        background-color: hsl(198, 100%, 65%);
      }
      .button.is-info.is-dark {
        background-color: hsl(198, 100%, 21%);
        border-color: hsl(198, 100%, 70%);
        color: hsl(198, 100%, 60%);
      }
      .button.is-info.is-dark:hover,
      .button.is-info.is-dark:focus {
        background-color: hsl(198, 100%, 16%);
      }

      /* Helpers */
      .has-background-inherit {
        background-color: inherit !important;
      }
      .has-text-centered {
        text-align: center !important;
      }
      .has-text-weight-normal {
        font-weight: 400 !important;
      }
      .is-family-primary {
        font-family: "Inter", "SF Pro", "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Helvetica Neue", "Helvetica", "Arial", sans-serif !important;
      }
      footer {
        margin-top: -150px;
      }
      canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -100;
      }
    </style>
  </head>

  <script>
    var c = document.getElementById('canv'),
        $ = c.getContext('2d'),
        w = 0,
        h = 0,
        t = 0,
        n = 1,
        num = 200,
        s, a, b,
        x, y, _x, _y,
        _t = 1 / 2500,
        rot = t / 2;

    var anim = function() {
      window.requestAnimationFrame(anim);
      $.fillStyle = 'hsla(0, 0%, 5%, 1)';
      $.fillRect(0, 0, w, h);

      for (var i = 0; i < n; i++) {
        a = (-i) * Math.PI / (n);
        x = 0;
        $.beginPath();
        $.rotate(rot);

        for (var j = 0; j < num; j++) {
          $.strokeStyle = 'hsla(55, 1%, 95%, .2)';
          s = Math.sin(15, Math.atan2((2, j * (num - j)), .93));
          x += 10.4 * s;
          y = x * Math.sin(b * a + 3 * t + x * -360) / -3;
          _x = x * Math.cos(b) + y * Math.sin(a);
          _y = x * Math.sin(b) + y * Math.cos(a);
          b = (j * -3) * Math.PI / 2;
          $.arc(w / 2 + _x * 2, h / 2 + _y * 2, 0, 0, 2 * Math.PI);
        }
        $.lineWidth = 1;
        $.stroke();
        $.rotate(rot);
      }
      t += _t;
    };
    scale();
    anim();

    function scale() {
      var dpr = window.devicePixelRatio || 1;
      var rect = c.getBoundingClientRect();
      w = rect.width;
      h = rect.height;
      c.width = Math.round(w * dpr);
      c.height = Math.round(h * dpr);
      $.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener('resize', scale, false);
  </script>
